name: SDK publish

# Build/test @zakai-app/mandate-sdk on every change under sdk/.
# Publish to GitHub Packages only on an explicit sdk@v* tag or workflow_dispatch —
# never on every main merge (founder control of the public package name).

on:
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-publish.yml"
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-publish.yml"
    tags:
      - "sdk@v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Packages (requires GH_PACKAGES_TOKEN secret)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: sdk

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    if: |
      github.event_name == 'workflow_dispatch' && inputs.publish == true
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk@v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@zakai-app"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - name: Publish @zakai-app/mandate-sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
