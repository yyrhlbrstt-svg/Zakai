name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:pack-labels

  # Open every page in a real browser at phone width.
  #
  # Every defect of this class found so far was found by loading the page and
  # none by the unit suite, which stayed green through a contract reminder
  # that fired after the deadline, a pricing page recommending the more
  # expensive plan, and four screens rendering raw translation keys. This job
  # is the cheapest version of the thing that actually works.
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npx next build
        env:
          # The sweep never touches the database — every swept route renders
          # without one — but the build reads the schema, so the variables
          # have to parse. A throwaway URL keeps CI from needing a real
          # database to check whether pages render.
          NEON_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEON_DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcd
      - name: Start server
        run: npx next start -p 3000 &
        env:
          NEON_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEON_DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcd
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/api/version && exit 0
            sleep 1
          done
          echo "server never came up"
          exit 1
      - name: Sweep every route
        run: npm run verify:routes
        env:
          BASE_URL: http://127.0.0.1:3000

      # Neither of these needs a database — they only load pages and touch
      # what is on them. They were manual until now, which meant the two
      # strongest guarantees this product has ("every door opens with
      # something to do", "no control is unreachable") protected nothing
      # between the moments somebody remembered to run them.
      - name: Every entry route opens with something to do
        run: npm run verify:first-screen
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: No control is unreachable
        run: npm run verify:flows
        env:
          BASE_URL: http://127.0.0.1:3000

  # Walk the loop a person walks, with a real database and real mail.
  #
  # WHY THIS JOB IS WORTH ITS MINUTES
  #
  # `verify` proves the code type-checks and the units hold. `routes` proves
  # every page renders. Neither can tell you whether somebody can sign up,
  # scan, open a case, prove ownership from a link in their email, send, and
  # record what they saved — which is the only sequence this company is for.
  #
  # It ran green for the first time today, by hand. Left by hand it would
  # have decayed the way every manual check decays: quietly, and discovered
  # by a user.
  loop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zakai
          POSTGRES_PASSWORD: zakai
          POSTGRES_DB: zakai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEON_DATABASE_URL: postgresql://zakai:zakai@127.0.0.1:5432/zakai
      NEON_DATABASE_URL_UNPOOLED: postgresql://zakai:zakai@127.0.0.1:5432/zakai
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcd
      # A mailbox on disk rather than a mail server. The journey reads the
      # ownership link out of a message that completed a real SMTP
      # conversation, which is the difference between proving the product
      # composed the right thing and proving it can be received.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USER: sink@localhost
      SMTP_PASS: sink
      ZAKAI_MAILDIR: /tmp/zakai-mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Ephemeral, and only ever ephemeral. A chargeable saving with no signed
      # Mandate is refused on purpose (see cases.ts), so without a key the run
      # stops one step short of the thing it exists to prove — and a
      # production key must never be reachable from a CI runner.
      - name: Generate a throwaway signing key
        run: |
          node -e '
            const {generateKeyPairSync}=require("crypto");
            const {privateKey}=generateKeyPairSync("ed25519");
            const j=privateKey.export({format:"jwk"});
            j.kid="ci-1"; j.alg="EdDSA"; j.use="sig";
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `MANDATE_SIGNING_KID=ci-1\nMANDATE_SIGNING_JWK=${JSON.stringify(j)}\n`);
          '

      - name: Apply the schema
        run: npx prisma db push --skip-generate
      - name: Build
        run: npx next build
      - name: Start the mail sink
        run: node scripts/dev-smtp-sink.mjs 2525 /tmp/zakai-mail &
      - name: Start server
        run: npx next start -p 3000 &
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/api/version && exit 0
            sleep 1
          done
          echo "server never came up"
          exit 1

      - name: Nobody can touch a case that is not theirs
        run: npm run verify:idor
      - name: The loop closes over the API
        run: npm run verify:money-loop
      - name: A stranger can walk the whole thing
        run: npm run verify:journey

      # The other way in: a bank feed instead of a pasted statement. The check
      # that earns its place here is not "the estimate appears" — it is that a
      # figure produced by the MOCK provider is labelled as demonstration data
      # on screen. A unit test can assert isLive === false; only a browser can
      # assert that the person reading the number is told.
      - name: The bank-feed path works and never passes fixtures off as real
        run: npm run verify:open-banking
        env:
          # The entry point ships dark: it renders fixture data, so it is
          # absent in production until somebody turns it on deliberately. CI
          # turns it on precisely so the thing being tested exists.
          ZAKAI_FLAG_OPEN_BANKING_ENTRY: "true"

  # The journeys, run against the PREVIEW DEPLOYMENT rather than a server this
  # job started itself.
  #
  # That distinction is the whole point. A locally-built copy passing proves
  # the code is fine and says nothing about the artefact that will actually be
  # visited — which is how a green pipeline and a broken demo coexisted. The
  # thing tested here is the thing that gets promoted.
  #
  # Needs the deployment to exist, so it waits for Vercel's status rather than
  # racing it.
  preview-journeys:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the Vercel preview
        id: preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 900
          check_interval: 10
      - name: Walk the three critical journeys on the preview
        run: npm run verify:journeys "${{ steps.preview.outputs.url }}"
      - name: Pre-demo checks against the same URL
        run: npm run pre-demo "${{ steps.preview.outputs.url }}"
