<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Zakai OG</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(120% 90% at 50% 42%, #0c1626 0%, #070b12 62%);
      color: #f2f6f5;
      font-family: "Heebo", "Segoe UI", sans-serif;
    }
    .mark {
      width: 110px;
      height: 110px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: 72px;
      font-weight: 800;
      background: linear-gradient(100deg, #3FCB9B, #3ec6ff 50%, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin: 18px 0 0;
      font-size: 32px;
      color: rgba(242,246,245,0.85);
    }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 110 110">
    <rect x="4" y="4" width="102" height="102" rx="26" fill="#3FCB9B"/>
    <path d="M32 34h46L34 76h46" fill="none" stroke="#0E1F1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>ZAKAI</h1>
  <p>הכסף שמגיע לך חוזר אליך</p>

</html>
